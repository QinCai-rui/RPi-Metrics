[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fleetmuster-hub"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
fleetmuster-hub = "fleetmuster_hub.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]
